name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # by hand: only the tests, no release

permissions:
  contents: write

jobs:
  # The tests are kept in a private repo (tobs_minigames-dev), read with a read-only deploy key
  # (the DEV_DEPLOY_KEY secret). A release is only published when they pass.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: tobs_minigames
      - uses: actions/checkout@v4
        with:
          repository: Vega421/tobs_minigames-dev
          ssh-key: ${{ secrets.DEV_DEPLOY_KEY }}
          path: tobs_minigames-dev
      - name: Install Lua 5.4
        run: sudo apt-get update -q && sudo apt-get install -y -q lua5.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests
        run: ./tobs_minigames-dev/run-tests.sh

  release:
    needs: tests
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zip
        run: |
          mkdir -p dist/tobs_minigames
          cp -r fxmanifest.lua config.lua locales shared client server web LICENSE README.md dist/tobs_minigames/
          cp .github/INSTALL.txt dist/INSTALL.txt
          cd dist && zip -r "tobs_minigames-${GITHUB_REF_NAME}.zip" INSTALL.txt tobs_minigames

      - name: Release notes from CHANGELOG.md
        run: python3 .github/release_notes.py "${GITHUB_REF_NAME}" > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: tobs_minigames ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*.zip
