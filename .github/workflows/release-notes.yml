name: Update release notes

# Rewrites the title and notes of every release from CHANGELOG.md,
# so fixing the changelog also fixes the release pages.
on:
  push:
    branches: [main]
    paths: ["CHANGELOG.md", ".github/release_notes.py"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update every release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName'); do
            python3 .github/release_notes.py "$tag" > notes.md
            gh release edit "$tag" --title "tobs_minigames $tag" --notes-file notes.md
          done
