<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>tobs_minigames</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="mg" class="hidden">
        <div class="panel">
            <header>
                <h1 id="mg-title"></h1>
                <div class="header-right">
                    <div id="mg-status"></div>
                    <div id="mg-time"></div>
                </div>
            </header>
            <div class="timer"><div id="mg-timer"></div></div>
            <main id="mg-body"></main>
            <footer>
                <span id="mg-hint"></span>
                <span id="mg-giveup"></span>
            </footer>
            <div id="mg-intro" class="hidden">
                <h2 id="mg-intro-title"></h2>
                <p id="mg-intro-howto"></p>
                <div id="mg-intro-start"></div>
                <div id="mg-intro-count"></div>
            </div>
            <div id="mg-result" class="hidden">
                <div id="mg-result-title"></div>
                <div id="mg-result-sub"></div>
            </div>
        </div>
    </div>
    <script src="logic.js"></script>
    <script src="app.js"></script>
</body>
</html>
